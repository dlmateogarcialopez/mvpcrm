# ============================================
# Máquina de Ventas — Docker Compose (Simplificado)
# 2 Servicios: Aplicación Unificada (API + Front) + Base de Datos (MySQL)
# ============================================

services:
  # --- DATABASE ---
  db:
    image: mysql:8.0
    container_name: mv-database
    restart: unless-stopped
    command:
      - --lower-case-table-names=2
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: cotizador_leads
      MYSQL_USER: mv_user
      MYSQL_PASSWORD: mv_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mv-network

  # --- UNIFIED APP (Backend + Frontend) ---
  app:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        VITE_APP_ID: ${VITE_APP_ID:-}
        VITE_OAUTH_PORTAL_URL: ${OAUTH_SERVER_URL:-}
        VITE_FRONTEND_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
        VITE_FRONTEND_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
    container_name: mv-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://mv_user:mv_password@db:3306/cotizador_leads
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      # --- Twilio (VoIP + SMS) ---
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY: ${TWILIO_API_KEY:-}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      ADVISOR_PHONE_NUMBER: ${ADVISOR_PHONE_NUMBER:-}
      VOIP_RECORDINGS_DIR: ${VOIP_RECORDINGS_DIR:-/var/lib/voip/recordings}
      # --- WhatsApp (Meta Cloud API) ---
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
      META_WHATSAPP_PHONE_ID: ${META_WHATSAPP_PHONE_ID:-}
      META_WHATSAPP_WABA_ID: ${META_WHATSAPP_WABA_ID:-}
      # Zona horaria por defecto para alertas (IANA TZ, ej. America/Bogota)
      ORG_TIMEZONE: ${ORG_TIMEZONE:-America/Bogota}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mv-network
    volumes:
      - ./docker-data/voip_recordings:/var/lib/voip/recordings

networks:
  mv-network:
    driver: bridge
